[[git.commit_parsers]]
message = "^bump version"
skip = true

[[git.commit_parsers]]
message = "^release:"
skip = true

[[git.commit_parsers]]
message = "^chore\\(release\\)"
skip = true

[[git.commit_parsers]]
message = "^Update \\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2}$"
skip = true

[[git.commit_parsers]]
message = "^\\[skip ci\\] Update \\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2}$"
skip = true

[[git.commit_parsers]]
message = "^Update .*Co-authored-by:.*devin-ai-integration.*$"
skip = true

[[git.commit_parsers]]
message = "^(\\w+)(?:\\(([^)]+)\\))?!?:\\s+(.+)"
group = "Other Changes"

[[git.commit_parsers]]
message = ".*"
group = "Other Changes"
