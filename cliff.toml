[changelog]
header = "# Changelog\n"
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}](https://github.com/alexeev-prog/nadzoring/releases/tag/{{version}}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | trim_start_matches(pat="^\\w+:{1,2}\\s*") | trim_start_matches(pat="^\\w+\\s*") | upper_first }}
  {%- if commit.pr_number %} ([#{{ commit.pr_number }}](https://github.com/alexeev-prog/nadzoring/pull/{{ commit.pr_number }})){% endif -%}
  {%- if commit.breaking %} [breaking]{% endif -%}
  ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/alexeev-prog/nadzoring/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
"""

[git]
conventional_commits = false
filter_unconventional = false

[[git.commit_parsers]]
message = "^Merge pull request"
skip = true

[[git.commit_parsers]]
message = "^Merge branch"
skip = true

[[git.commit_parsers]]
message = "^Merge remote-tracking branch"
skip = true

[[git.commit_parsers]]
message = "^Merge tag"
skip = true

[[git.commit_parsers]]
message = ".*!:.*"
group = "⚠️ Breaking Changes"

[[git.commit_parsers]]
message = "^feat(\\(.*\\))?:?"
group = "Features"

[[git.commit_parsers]]
message = "^feature(\\(.*\\))?:?"
group = "Features"

[[git.commit_parsers]]
message = "^add(\\(.*\\))?:?"
group = "Features"

[[git.commit_parsers]]
message = "^implement(\\(.*\\))?:?"
group = "Features"

[[git.commit_parsers]]
message = "^create(\\(.*\\))?:?"
group = "Features"

[[git.commit_parsers]]
message = "^fix(\\(.*\\))?:?"
group = "Bug Fixes"

[[git.commit_parsers]]
message = "^hotfix(\\(.*\\))?:?"
group = "Bug Fixes"

[[git.commit_parsers]]
message = "^bugfix(\\(.*\\))?:?"
group = "Bug Fixes"

[[git.commit_parsers]]
message = "^correct(\\(.*\\))?:?"
group = "Bug Fixes"

[[git.commit_parsers]]
