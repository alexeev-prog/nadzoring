name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  core-diagnostics:
    name: Core diagnostics (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install uv
      run: python -m pip install uv
    - name: Install development dependencies
      run: uv sync --all-groups
    - name: Test diagnostics and command integration without network probes
      run: uv run pytest tests/test_core.py -q

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv and nox
      run: |
        python -m pip install --upgrade pip
        python -m pip install uv nox

    - name: Lint
      run: nox --session lint

    - name: Type checking
      run: nox --session mypy_typing

    - name: Run tests
      run: nox --session test

    - name: Upload coverage to Coveralls
      if: matrix.python-version == '3.14'
      env:
        COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        pip install coveralls
        coveralls --service=github
