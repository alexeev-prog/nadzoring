name: docs

on:
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        pip install "sphinx<8" furo sphinx-multiversion

    - name: Build versioned docs
      run: |
        cd docs
        sphinx-multiversion . _build/html

        # Редирект с корня на latest (main)
        echo '<meta http-equiv="refresh" content="0; url=main/">' > _build/html/index.html

    - name: Upload pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs/_build/html

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
