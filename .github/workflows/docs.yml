name: Docs (Stable)

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  deploy-stable:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository at tag
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.release.tag_name }}
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        pip install sphinx furo
        pip install -e .

    - name: Create directories
      run: |
        mkdir -p docs/source/_static
        mkdir -p docs/source/api

    - name: Generate API docs
      run: |
        chmod +x ./genapidoc.sh
        ./genapidoc.sh

    - name: Build documentation (stable)
      env:
        NADZORING_DOCS_TYPE: stable
      run: |
        cd docs
        sphinx-build -b html -c . source build

    - name: Create root index redirect
      run: |
        echo '<!DOCTYPE html>
        <html>
        <head>
          <meta http-equiv="refresh" content="0; url=./stable/">
          <link rel="canonical" href="./stable/" />
        </head>
        <body>
          <p>Redirecting to <a href="./stable/">stable version</a>...</p>
        </body>
        </html>' > ./docs/build/redirect.html

    - name: Deploy root index (stable redirect)
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/build
        destination_dir: ./
        keep_files: true
        publish_branch: gh-pages
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
        
    - name: Deploy to gh-pages (stable)
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/build
        destination_dir: stable
        keep_files: true
        publish_branch: gh-pages
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
