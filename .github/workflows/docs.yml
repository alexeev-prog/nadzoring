name: Docs

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        pip install sphinx furo
        pip install -e .

    - name: Create necessary directories
      run: |
        mkdir -p docs/source/_static
        mkdir -p docs/source/api

    - name: Generate API docs
      run: |
        chmod +x ./genapidoc.sh
        ./genapidoc.sh

    - name: Build latest docs
      env:
        NADZORING_DOCS_TYPE: latest
      run: |
        cd docs
        sphinx-build -b html -c . source build_latest

    - name: Build stable docs (if release)
      if: github.event_name == 'release'
      env:
        NADZORING_DOCS_TYPE: stable
      run: |
        cd docs
        sphinx-build -b html -c . source build_stable

    - name: Prepare Pages artifact
      run: |
        mkdir -p _site
        
        cp -r docs/build_latest _site/latest
        
        if [ -d "docs/build_stable" ]; then
          cp -r docs/build_stable _site/stable
          cat > _site/index.html << 'EOF'
<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="refresh" content="0; url=stable/">
    <title>Nadzoring Documentation</title>
</head>
<body>
    <p>Redirecting to <a href="stable/">stable documentation</a>...</p>
</body>
</html>
EOF
        else
          cat > _site/index.html << 'EOF'
<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="refresh" content="0; url=latest/">
    <title>Nadzoring Documentation</title>
</head>
<body>
    <p>Redirecting to <a href="latest/">latest documentation</a>...</p>
</body>
</html>
EOF
        fi

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
