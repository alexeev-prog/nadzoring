name: docs

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────────────────────
  # Stable: деплоится в /nadzoring/ только при релизе
  # ──────────────────────────────────────────────────────────────
  deploy-stable:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install sphinx furo tomli

      - name: Generate API docs
        run: |
          chmod +x genapidoc.sh
          ./genapidoc.sh

      - name: Build stable docs
        run: |
          cd docs
          make clean
          make html
        env:
          NADZORING_DOCS_TYPE: stable

      # Деплоим в корень gh-pages (= /nadzoring/ для GitHub Pages)
      - name: Deploy stable → /nadzoring/
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html
          destination_dir: .
          keep_files: true
          publish_branch: gh-pages

  # ──────────────────────────────────────────────────────────────
  # Latest: деплоится в /nadzoring/latest/ при каждом пуше в main
  # ──────────────────────────────────────────────────────────────
  deploy-latest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install sphinx furo tomli

      - name: Generate API docs
        run: |
          chmod +x genapidoc.sh
          ./genapidoc.sh

      - name: Build latest docs
        run: |
          cd docs
          make clean
          make html
        env:
          NADZORING_DOCS_TYPE: latest

      # Деплоим в /latest/ на gh-pages (= /nadzoring/latest/)
      - name: Deploy latest → /nadzoring/latest/
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html
          destination_dir: latest
          keep_files: true
          publish_branch: gh-pages

      # Если stable (корневой index.html) ещё не существует —
      # кладём редирект / → /nadzoring/latest/
      - name: Check if stable root exists on gh-pages
        id: check-stable
        run: |
          git fetch origin gh-pages 2>/dev/null || true
          if git ls-tree origin/gh-pages --name-only 2>/dev/null | grep -q "^index.html$"; then
            echo "stable_exists=true"  >> $GITHUB_OUTPUT
          else
            echo "stable_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create redirect index.html → /nadzoring/latest/
        if: steps.check-stable.outputs.stable_exists == 'false'
        run: |
          mkdir -p _redirect_root
          cat > _redirect_root/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=latest/">
              <title>Redirecting to latest docs…</title>
            </head>
            <body>
              <p>Redirecting to <a href="latest/">latest documentation</a>…</p>
            </body>
          </html>
          EOF

      - name: Deploy redirect → /nadzoring/ root
        if: steps.check-stable.outputs.stable_exists == 'false'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_redirect_root
          destination_dir: .
          keep_files: true
          publish_branch: gh-pages
