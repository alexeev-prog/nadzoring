name: docs

on:
  push:
    branches: [main]  # для latest версии
  release:
    types: [published]  # для stable версии

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-stable:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        pip install sphinx furo tomli

    - name: Generate API docs
      run: |
        chmod +x genapidoc.sh
        ./genapidoc.sh

    - name: Build stable docs
      run: |
        cd docs
        make clean
        make html
      env:
        NADZORING_DOCS_TYPE: stable

    - name: Deploy to GitHub Pages (stable)
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/_build/html
        destination_dir: .  # корень сайта
        keep_files: true
        publish_branch: gh-pages

  deploy-latest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        pip install sphinx furo tomli

    - name: Generate API docs
      run: |
        chmod +x genapidoc.sh
        ./genapidoc.sh

    - name: Build latest docs
      run: |
        cd docs
        make clean
        make html
      env:
        NADZORING_DOCS_TYPE: latest

    - name: Check if stable exists
      id: check-stable
      run: |
        if git ls-remote --heads origin gh-pages | grep -q "gh-pages"; then
          echo "stable_exists=true" >> $GITHUB_OUTPUT
        else
          echo "stable_exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Deploy to GitHub Pages (latest)
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/_build/html
        destination_dir: latest
        keep_files: false

    - name: Deploy to root if no stable exists
      if: steps.check-stable.outputs.stable_exists == 'false'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/_build/html
        destination_dir: .
        keep_files: false
