name: Docs (Latest)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy-latest:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        pip install sphinx furo
        pip install -e .

    - name: Create directories
      run: |
        mkdir -p docs/source/_static
        mkdir -p docs/source/api

    - name: Generate API docs
      run: |
        chmod +x ./genapidoc.sh
        ./genapidoc.sh

    - name: Build documentation (latest)
      env:
        NADZORING_DOCS_TYPE: latest
      run: |
        cd docs
        sphinx-build -b html -c . source build

    - name: Create root redirect to latest (only if root doesn't exist)
      run: |
        # Создаем временную директорию для корневого файла
        mkdir -p ./root_temp
        echo '<!DOCTYPE html>
        <html>
        <head>
          <meta http-equiv="refresh" content="0; url=./latest/">
          <link rel="canonical" href="./latest/" />
        </head>
        <body>
          <p>Redirecting to <a href="./latest/">latest version</a>...</p>
        </body>
        </html>' > ./root_temp/index.html

    - name: Deploy root redirect (if needed)
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./root_temp
        destination_dir: ./
        keep_files: true
        publish_branch: gh-pages
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'

    - name: Deploy to gh-pages (latest)
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/build
        destination_dir: latest
        keep_files: true
        publish_branch: gh-pages
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
