[project]
name = "nadzoring"
version = "0.1.10"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alexeev Bronislav", email = "alexeev.dev@mail.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.3",
    "certifi>=2026.1.4",
    "click>=8.3.1",
    "cryptography>=46.0.5",
    "dnspython>=2.8.0",
    "elevate>=0.1.3",
    "geopy>=2.4.1",
    "netifaces>=0.11.0",
    "pandas>=3.0.1",
    "ping3>=5.1.5",
    "pysocks>=1.7.1",
    "python-dateutil>=2.9.0.post0",
    "python-whois>=0.9.6",
    "pyyaml>=6.0.3",
    "requests[socks]>=2.32.5",
    "scapy>=2.7.0",
    "tabulate>=0.9.0",
    "tqdm>=4.67.3",
]

[project.scripts]
nadzoring = "nadzoring.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "furo>=2025.12.19",
    "mutmut>=3.5.0",
    "mypy>=1.19.1",
    "nox>=2026.2.9",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-sugar>=1.1.1",
    "ruff>=0.15.1",
    "sphinx>=9.1.0",
    "types-click>=7.1.8",
    "types-requests>=2.32.4.20260107",
    "types-tabulate>=0.10.0.20260308",
    "types-tqdm>=4.67.3.20260303",
    "types-certifi>=2021.10.8.3",
    "types-cryptography>=3.3.23.2",
    "git-cliff>=2.12.0",
    "pyrefly>=0.56.0",
    "types-pyyaml>=6.0.12.20250915",
    "pytest-xdist>=3.8.0",
    "coveralls>=4.1.0",
    "basedpyright>=1.38.3",
]

