[project]
name = "nadzoring"
version = "0.1.9"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alexeev Bronislav", email = "alexeev.dev@mail.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.3",
    "certifi>=2026.1.4",
    "click>=8.3.1",
    "cryptography>=46.0.5",
    "dnspython>=2.8.0",
    "elevate>=0.1.3",
    "geopy>=2.4.1",
    "netifaces>=0.11.0",
    "pandas>=3.0.1",
    "ping3>=5.1.5",
    "pysocks>=1.7.1",
    "python-dateutil>=2.9.0.post0",
    "python-whois>=0.9.6",
    "requests[socks]>=2.32.5",
    "scapy>=2.7.0",
    "tabulate>=0.9.0",
    "tqdm>=4.67.3",
]

[project.scripts]
nadzoring = "nadzoring.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.ruff.lint]
select = [
  "A",    # flake8-builtins
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "C90",  # maccabe
  "COM",  # flake8-commas
  "D",    # pydocstyle
  "DTZ",  # flake8-datetimez
  "E",    # pycodestyle
  "ERA",  # flake8-eradicate
  "EXE",  # flake8-executable
  "F",    # pyflakes
  "FBT",  # flake8-boolean-trap
  "FLY",  # pyflint
  "FURB", # refurb
  "G",    # flake8-logging-format
  "I",    # isort
  "ICN",  # flake8-import-conventions
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # flake8-logging
  "N",    # pep8-naming
  "PERF", # perflint
  "PIE",  # flake8-pie
  "PL",   # pylint
  "PT",   # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "Q",    # flake8-quotes
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",  # ruff
  "S",    # flake8-bandit
  "SIM",  # flake8-simpify
  "SLF",  # flake8-self
  "SLOT", # flake8-slots
  "T100", # flake8-debugger
  "TRY",  # tryceratops
  "UP",   # pyupgrade
  "W",    # pycodestyle
  "YTT",  # flake8-2020
]
ignore = [
  "A005",   # allow to shadow stdlib and builtin module names
  "COM812", # trailing comma, conflicts with `ruff format`
  # Different doc rules that we don't really care about:
  "D100",
  "D104",
  "D106",
  "D203",
  "D212",
  "D401",
  "D404",
  "D405",
  "ISC001",  # implicit string concat conflicts with `ruff format`
  "ISC003",  # prefer explicit string concat over implicit concat
  "PLR09",   # we have our own complexity rules
  "PLR2004", # do not report magic numbers
  "PLR6301", # do not require classmethod / staticmethod when self not used
  "TRY003",  # long exception messages from `tryceratops`
]

[dependency-groups]
dev = [
    "furo>=2025.12.19",
    "mutmut>=3.5.0",
    "mypy>=1.19.1",
    "nox>=2026.2.9",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-sugar>=1.1.1",
    "ruff>=0.15.1",
    "sphinx>=9.1.0",
    "types-click>=7.1.8",
    "types-requests>=2.32.4.20260107",
    "types-tabulate>=0.10.0.20260308",
    "types-tqdm>=4.67.3.20260303",
    "types-certifi>=2021.10.8.3",
    "types-cryptography>=3.3.23.2",
    "git-cliff>=2.12.0",
    "pyrefly>=0.56.0",
]

