{%- if current %}
<div class="sidebar-tree">
  <p class="caption" role="heading"><span>Versions</span></p>
  <ul>
    {%- for rev in revisions | sort(attribute="date") | reverse %}
    <li class="toctree-l1 {%- if rev.name == current.name %} current{% endif %}">
      <a class="reference" href="{{ pathto('index', 1) | replace(current.name + '/', '') }}{{ rev.name }}/">
        {{ rev.name }}
        {%- if loop.first %} <em>(latest)</em>{% endif %}
      </a>
    </li>
    {%- endfor %}
  </ul>
</div>
{%- endif %}
