# ----------------------------------------------------> ruff.toml <----------------------------------------------------

preview = true
show-fixes = true
unsafe-fixes = false
respect-gitignore = true
force-exclude = true
line-length = 120
indent-width = 4

exclude = [
    ".git",
    ".github",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    ".vscode",
    ".cursor",
    ".idea",
    "__pypackages__",
    "build",
    "dist",
    "site-packages",
    "docs"
]

[format]
quote-style = "double"
docstring-code-format = true
preview = true
docstring-code-line-length = "dynamic"
skip-magic-trailing-comma = false
line-ending = "lf"
indent-style = "space"

[lint]
preview = true
fixable = ["ALL"]
unfixable = []

select = [
  "A",     # flake8-builtins
  "B",     # flake8-bugbear
  "C4",    # flake8-comprehensions
  "C90",   # mccabe
  "COM",   # flake8-commas
  "D",     # pydocstyle
  "DTZ",   # flake8-datetimez
  "E",     # pycodestyle
  "ERA",   # flake8-eradicate
  "EXE",   # flake8-executable
  "F",     # pyflakes
  "FBT",   # flake8-boolean-trap
  "FLY",   # flynt
  "FURB",  # refurb
  "G",     # flake8-logging-format
  "I",     # isort
  "ICN",   # flake8-import-conventions
  "ISC",   # flake8-implicit-str-concat
  "LOG",   # flake8-logging
  "N",     # pep8-naming
  "PERF",  # perflint
  "PIE",   # flake8-pie
  "PL",    # pylint
  "PT",    # flake8-pytest-style
  "PTH",   # flake8-use-pathlib
  "Q",     # flake8-quotes
  "RET",   # flake8-return
  "RSE",   # flake8-raise
  "RUF",   # ruff
  # "S",     # flake8-bandit
  "SIM",   # flake8-simplify
  "SLF",   # flake8-self
  "SLOT",  # flake8-slots
  "T100",  # flake8-debugger
  "TRY",   # tryceratops
  "UP",    # pyupgrade
  "W",     # pycodestyle
  "YTT",   # flake8-2020
]
ignore = [
  "A005",   # allow to shadow stdlib and builtin module names
  "COM812", # trailing comma, conflicts with `ruff format`
  # Different doc rules that we don't really care about:
  "D100",
  "D104",
  "D106",
  "D203",
  "D212",
  "D401",
  "D404",
  "D405",
  "ISC001",  # implicit string concat conflicts with `ruff format`
  "ISC003",  # prefer explicit string concat over implicit concat
  "PLR09",   # we have our own complexity rules
  "PLR2004", # do not report magic numbers
  "PLR6301", # do not require classmethod / staticmethod when self not used
  "TRY003",  # long exception messages from `tryceratops`
]

[lint.pycodestyle]
ignore-overlong-task-comments = true
max-doc-length = 120
max-line-length = 120

[lint.mccabe]
max-complexity = 10

[lint.pydocstyle]
convention = "google"

[lint.flake8-type-checking]
quote-annotations = false
exempt-modules = ["typing", "typing_extensions"]

# Plugin connectors use lazy imports inside ``probe()`` to keep CLI startup light
# and mirror domain-layer import patterns; ``meta`` is intentionally a class-level
# descriptor on dataclass-backed connectors.
[lint.per-file-ignores]
"src/nadzoring/plugins/**" = [
    "PLC0415",
    "D102",
    "RUF045",
]
"tests/test_plugins/**" = [
    "D103",
    "FBT001",
    "PLC0415",
]
