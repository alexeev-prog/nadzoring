repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        files: ^src/nadzoring/
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        files: ^src/nadzoring/
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy src/nadzoring/
        language: system
        files: ^src/nadzoring/.*\.py$|^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
